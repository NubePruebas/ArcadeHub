<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piedra Papel Tijera</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #e2e8f0; font-family: system-ui, sans-serif; }
    h1 { margin: 0 0 0.5rem; font-size: 1.3rem; text-align: center; }
    .score { text-align: center; font-weight: 700; margin-bottom: 1rem; }
    .choices { display: flex; gap: 0.75rem; justify-content: center; }
    .choices button { width: 88px; height: 88px; border: 0; border-radius: 16px; background: #1e1b4b; color: #fff; font-size: 2rem; cursor: pointer; }
    .choices button:hover { background: #312e81; }
    .result { text-align: center; margin-top: 1.1rem; min-height: 3.2rem; font-weight: 700; }
    .vs { display: flex; justify-content: center; gap: 1.5rem; margin-top: 1rem; font-size: 2.4rem; }
    button.reset { display: block; margin: 1rem auto 0; border: 0; background: #7c3aed; color: #fff; font-weight: 700; padding: 0.55rem 1rem; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <h1>Piedra · Papel · Tijera</h1>
    <div class="score">Tú <b id="you">0</b> — <b id="cpu">0</b> CPU</div>
    <div class="choices">
      <button data-c="piedra" title="Piedra">✊</button>
      <button data-c="papel" title="Papel">🖐️</button>
      <button data-c="tijera" title="Tijera">✌️</button>
    </div>
    <div class="vs"><span id="youPick">❔</span><span style="font-size:1rem;align-self:center;opacity:.6">vs</span><span id="cpuPick">❔</span></div>
    <div class="result" id="result">Elige tu jugada</div>
    <button class="reset" id="reset">Reiniciar marcador</button>
  </div>
  <script>
    const map = { piedra: "✊", papel: "🖐️", tijera: "✌️" };
    const beats = { piedra: "tijera", papel: "piedra", tijera: "papel" };
    const opts = Object.keys(map);
    let you = 0, cpu = 0;

    document.querySelectorAll("[data-c]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const pick = btn.dataset.c;
        const cpuChoice = opts[Math.floor(Math.random() * 3)];
        document.getElementById("youPick").textContent = map[pick];
        document.getElementById("cpuPick").textContent = map[cpuChoice];
        let msg;
        if (pick === cpuChoice) msg = "Empate";
        else if (beats[pick] === cpuChoice) { you++; msg = "¡Ganaste la ronda!"; }
        else { cpu++; msg = "Gana la CPU"; }
        document.getElementById("you").textContent = you;
        document.getElementById("cpu").textContent = cpu;
        document.getElementById("result").textContent = msg;
      });
    });

    document.getElementById("reset").onclick = () => {
      you = 0; cpu = 0;
      document.getElementById("you").textContent = "0";
      document.getElementById("cpu").textContent = "0";
      document.getElementById("youPick").textContent = "❔";
      document.getElementById("cpuPick").textContent = "❔";
      document.getElementById("result").textContent = "Elige tu jugada";
    };
  </script>
</body>
</html>

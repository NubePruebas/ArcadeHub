<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .wrap { text-align: center; }
    canvas { background: #111827; border: 2px solid #334155; border-radius: 12px; max-width: 100%; touch-action: none; }
    .hud { display: flex; gap: 1rem; justify-content: center; margin-bottom: 0.6rem; font-weight: 700; }
    button { margin-top: 0.7rem; border: 0; background: #16a34a; color: #fff; font-weight: 700; padding: 0.55rem 1rem; border-radius: 8px; cursor: pointer; }
    p { opacity: 0.7; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud"><span>Puntos: <b id="score">0</b></span><span id="status">Flechas / WASD</span></div>
    <canvas id="c" width="400" height="400"></canvas>
    <div><button id="restart">Reiniciar</button></div>
    <p>En móvil: desliza para mover</p>
  </div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const N = 20, SIZE = canvas.width / N;
    let snake, dir, nextDir, food, score, alive, tick;

    function reset() {
      snake = [{ x: 10, y: 10 }];
      dir = nextDir = { x: 1, y: 0 };
      score = 0;
      alive = true;
      placeFood();
      document.getElementById("score").textContent = "0";
      document.getElementById("status").textContent = "Jugando";
      clearInterval(tick);
      tick = setInterval(step, 110);
      draw();
    }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
      } while (snake.some((s) => s.x === food.x && s.y === food.y));
    }

    function step() {
      if (!alive) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some((s) => s.x === head.x && s.y === head.y)) {
        alive = false;
        document.getElementById("status").textContent = "Game Over";
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").textContent = score;
        placeFood();
      } else snake.pop();
      draw();
    }

    function draw() {
      ctx.fillStyle = "#111827";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f43f5e";
      ctx.fillRect(food.x * SIZE, food.y * SIZE, SIZE - 1, SIZE - 1);
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? "#4ade80" : "#22c55e";
        ctx.fillRect(s.x * SIZE, s.y * SIZE, SIZE - 1, SIZE - 1);
      });
    }

    function setDir(x, y) {
      if (dir.x + x === 0 && dir.y + y === 0) return;
      nextDir = { x, y };
    }

    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (["arrowup", "w"].includes(k)) setDir(0, -1);
      if (["arrowdown", "s"].includes(k)) setDir(0, 1);
      if (["arrowleft", "a"].includes(k)) setDir(-1, 0);
      if (["arrowright", "d"].includes(k)) setDir(1, 0);
    });

    let tx, ty;
    canvas.addEventListener("touchstart", (e) => {
      tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    }, { passive: true });
    canvas.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
    });

    document.getElementById("restart").onclick = reset;
    reset();
  </script>
</body>
</html>

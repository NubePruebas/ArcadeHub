<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whack-a-Mole</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .hud { display: flex; gap: 1.2rem; justify-content: center; font-weight: 700; margin-bottom: 0.8rem; }
    .grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 12px; }
    .hole { width: 100px; height: 100px; border-radius: 50%; background: #3f2a14; border: 4px solid #1c1917; display: grid; place-items: center; cursor: pointer; position: relative; overflow: hidden; }
    .mole { font-size: 2.4rem; transform: translateY(70px); transition: transform 0.12s; user-select: none; }
    .mole.up { transform: translateY(0); }
    button { margin-top: 1rem; border: 0; background: #b45309; color: #fff; font-weight: 700; padding: 0.55rem 1rem; border-radius: 8px; cursor: pointer; display: block; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <div>
    <div class="hud"><span>Puntos: <b id="score">0</b></span><span>Tiempo: <b id="time">30</b>s</span></div>
    <div class="grid" id="grid"></div>
    <button id="start">Empezar</button>
  </div>
  <script>
    const grid = document.getElementById("grid");
    const holes = [];
    let score = 0, time = 30, timer, spawner, playing = false;

    for (let i = 0; i < 9; i++) {
      const hole = document.createElement("div");
      hole.className = "hole";
      const mole = document.createElement("div");
      mole.className = "mole";
      mole.textContent = "🐹";
      hole.appendChild(mole);
      hole.addEventListener("click", () => {
        if (!playing || !mole.classList.contains("up")) return;
        score++;
        document.getElementById("score").textContent = score;
        mole.classList.remove("up");
      });
      grid.appendChild(hole);
      holes.push(mole);
    }

    function start() {
      clearInterval(timer); clearInterval(spawner);
      score = 0; time = 30; playing = true;
      document.getElementById("score").textContent = "0";
      document.getElementById("time").textContent = "30";
      document.getElementById("start").textContent = "Reiniciar";
      holes.forEach((m) => m.classList.remove("up"));
      timer = setInterval(() => {
        time--;
        document.getElementById("time").textContent = time;
        if (time <= 0) {
          playing = false;
          clearInterval(timer); clearInterval(spawner);
          holes.forEach((m) => m.classList.remove("up"));
          document.getElementById("start").textContent = "Otra partida";
        }
      }, 1000);
      spawner = setInterval(() => {
        if (!playing) return;
        const m = holes[Math.floor(Math.random() * holes.length)];
        m.classList.add("up");
        setTimeout(() => m.classList.remove("up"), 700 + Math.random() * 400);
      }, 550);
    }

    document.getElementById("start").onclick = start;
  </script>
</body>
</html>

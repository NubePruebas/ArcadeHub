<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B · Retro Pixel — ArcadeHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#07140c; --panel:#0d2216; --text:#d7ffb8; --muted:#7fad6e; --amber:#fbbf24; --lime:#86efac; --line:#1f3d28; }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--text); font-family: VT323, monospace; font-size: 1.25rem;
      background: var(--bg);
      background-image:
        linear-gradient(rgba(0,0,0,.15) 1px, transparent 1px),
        radial-gradient(ellipse at top, #0f2918, var(--bg));
      background-size: 100% 3px, auto;
    }
    .pick { position: sticky; top: 0; z-index: 50; background: #041009ee; border-bottom: 3px solid var(--lime); padding: .7rem 1rem; display: flex; gap: .75rem; align-items: center; justify-content: space-between; }
    .pick a { color: var(--amber); text-decoration: none; font-family: "Press Start 2P", monospace; font-size: .55rem; }
    .pick strong { font-family: "Press Start 2P", monospace; font-size: .65rem; color: var(--lime); }
    .shell { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; }
    header.site { border-bottom: 4px solid var(--amber); background: #0a1c12; }
    .hi { display: flex; align-items: center; gap: 1rem; min-height: 72px; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: var(--amber); }
    .mark { width: 2.2rem; height: 2.2rem; display: grid; place-items: center; background: var(--lime); color: #06210f; font-family: "Press Start 2P", monospace; font-size: .45rem; border: 3px solid #000; box-shadow: 3px 3px 0 #000; }
    .name { font-family: "Press Start 2P", monospace; font-size: .72rem; line-height: 1.4; }
    nav { display: flex; gap: .9rem; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--amber); }
    .search { margin-left: auto; }
    .search input { background: #041209; border: 3px solid #000; box-shadow: 3px 3px 0 var(--lime); color: var(--text); padding: .45rem .8rem; font: inherit; min-width: 200px; }
    .intro { padding: 2rem 0 1rem; }
    .eyebrow { color: var(--amber); font-family: "Press Start 2P", monospace; font-size: .55rem; margin: 0 0 .8rem; }
    h1 { margin: 0; font-family: "Press Start 2P", monospace; font-size: clamp(.85rem, 2.5vw, 1.25rem); line-height: 1.55; color: var(--lime); text-shadow: 3px 3px 0 #000; }
    .lede { color: var(--muted); max-width: 46ch; }
    .stats { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1rem; }
    .stats div { background: var(--panel); border: 3px solid #000; box-shadow: 3px 3px 0 var(--amber); padding: .6rem .9rem; }
    .stats strong { color: var(--amber); font-family: "Press Start 2P", monospace; font-size: .7rem; display: block; }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.2rem 0; }
    .chip { font: inherit; border: 3px solid #000; background: var(--panel); color: var(--text); padding: .35rem .7rem; box-shadow: 2px 2px 0 #000; cursor: pointer; }
    .chip.on { background: var(--amber); color: #111; }
    h2 { font-family: "Press Start 2P", monospace; font-size: .7rem; color: var(--amber); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(170px,1fr)); gap: 1rem; padding-bottom: 2.5rem; }
    .card { background: var(--panel); border: 4px solid #000; box-shadow: 4px 4px 0 #000; }
    .card:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--lime); }
    .thumb { aspect-ratio: 1; display: grid; place-items: center; font-size: 2.6rem; border-bottom: 4px solid #000; image-rendering: pixelated; }
    .info { padding: .7rem; }
    .info h3 { margin: 0; font-family: "Press Start 2P", monospace; font-size: .55rem; line-height: 1.5; }
    .info p { margin: .4rem 0 0; color: var(--muted); font-size: 1.05rem; }
    .tag { color: var(--amber); }
  </style>
</head>
<body>
  <div class="pick">
    <strong>DEMO B · RETRO PIXEL</strong>
    <div><a href="./">← Todas</a> · <a href="c-esports-hud.html">Siguiente C →</a></div>
  </div>
  <header class="site"><div class="shell hi">
    <a class="logo" href="#"><span class="mark">AH</span><span class="name">ARCADEHUB</span></a>
    <nav><a href="#">Juegos</a><a href="#">Cats</a><a href="#">Admin</a></nav>
    <label class="search"><input placeholder="BUSCAR..." /></label>
  </div></header>
  <main class="shell">
    <section class="intro">
      <p class="eyebrow">INSERT COIN TO CONTINUE</p>
      <h1>PIXEL GAMES<br/>LOADED.</h1>
      <p class="lede">Minijuegos clásicos y links externos. Estética cabinet 8-bit.</p>
      <div class="stats">
        <div><strong>8</strong>juegos</div>
        <div><strong>4</strong>cats</div>
        <div><strong>OK</strong>html5</div>
      </div>
    </section>
    <div class="chips">
      <button class="chip on">TODOS</button><button class="chip">ARCADE</button><button class="chip">PUZZLE</button><button class="chip">ACCION</button>
    </div>
    <h2>> SELECT GAME</h2>
    <div class="grid" id="g"></div>
  </main>
  <script>
    const games=[["Snake","#166534","🐍","ARCADE"],["3 en Raya","#1d4ed8","⭕","STRAT"],["Memory","#9d174d","🧠","PUZZLE"],["Pong","#115e59","🏓","ARCADE"],["Breakout","#9a3412","🧱","ARCADE"],["Flappy","#3f6212","🐥","ARCADE"],["Whack","#78350f","🔨","ACCION"],["RPS","#5b21b6","✊","STRAT"]];
    document.getElementById("g").innerHTML=games.map(([t,c,e,cat])=>`<article class="card"><div class="thumb" style="background:${c}"><span>${e}</span></div><div class="info"><h3>${t}</h3><p class="tag">${cat}</p></div></article>`).join("");
  </script>
</body>
</html>

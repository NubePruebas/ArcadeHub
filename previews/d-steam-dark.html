<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D · Steam Dark — ArcadeHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Motiva+Sans:wght@500;700&family=Noto+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#1b2838; --panel:#16202d; --card:#2a475e; --text:#c7d5e0; --muted:#8f98a0; --blue:#66c0f4; --line:#2a475e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans", sans-serif; color: var(--text); background: linear-gradient(180deg,#1b2838 0%,#171a21 40%); min-height: 100vh; }
    .pick { position: sticky; top: 0; z-index: 50; background: #171a21ee; border-bottom: 1px solid #000; padding: .7rem 1rem; display: flex; justify-content: space-between; align-items: center; }
    .pick strong { color: var(--blue); }
    .pick a { color: var(--blue); font-weight: 700; text-decoration: none; }
    .shell { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; }
    header.site { background: #171a21; border-bottom: 1px solid #000; }
    .hi { display: flex; align-items: center; gap: 1rem; min-height: 58px; }
    .logo { display: flex; align-items: center; gap: .5rem; text-decoration: none; color: #fff; font-weight: 700; }
    .mark { width: 1.9rem; height: 1.9rem; border-radius: 4px; background: var(--blue); color: #1b2838; display: grid; place-items: center; font-size: .7rem; font-weight: 800; }
    .name { font-family: Teko, sans-serif; font-size: 1.55rem; letter-spacing: .04em; }
    nav { display: flex; gap: .9rem; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: .88rem; text-transform: uppercase; }
    nav a:hover { color: #fff; }
    .search { margin-left: auto; }
    .search input { background: #316282; border: 0; color: #fff; border-radius: 3px; padding: .5rem .8rem; min-width: 230px; font: inherit; }
    .layout { display: grid; grid-template-columns: 210px 1fr; gap: 1.1rem; padding: 1.3rem 0 2.5rem; }
    .side { background: var(--panel); padding: .9rem; border-radius: 3px; height: fit-content; }
    .side h2 { margin: 0 0 .6rem; font-size: .85rem; color: var(--blue); text-transform: uppercase; letter-spacing: .05em; }
    .side button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); padding: .45rem .5rem; font: inherit; font-weight: 600; border-radius: 2px; cursor: pointer; }
    .side button.on, .side button:hover { background: #66c0f433; color: #fff; }
    .hero { background: linear-gradient(90deg,#2a475e,#1b2838); border-radius: 3px; padding: 1.3rem 1.4rem; margin-bottom: 1rem; }
    .eyebrow { margin: 0; color: var(--blue); font-size: .78rem; font-weight: 700; text-transform: uppercase; }
    h1 { margin: .25rem 0; font-family: Teko, sans-serif; font-size: 2.6rem; color: #fff; letter-spacing: .02em; line-height: 1; }
    .lede { margin: 0; color: var(--muted); max-width: 48ch; }
    .meta { margin-top: .8rem; display: flex; gap: 1rem; color: var(--muted); font-size: .85rem; }
    .meta b { color: #fff; }
    .section-title { margin: 0 0 .7rem; font-size: .95rem; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: .75rem; }
    .card { background: #0006; border-radius: 3px; overflow: hidden; transition: .15s; cursor: pointer; }
    .card:hover { transform: scale(1.03); box-shadow: 0 0 0 1px var(--blue); }
    .thumb { aspect-ratio: 16/9; display: grid; place-items: center; font-size: 2.1rem; }
    .info { padding: .55rem .65rem .7rem; background: #16202d; }
    .info h3 { margin: 0; font-size: .92rem; color: #fff; }
    .info p { margin: .2rem 0 0; color: var(--muted); font-size: .75rem; }
    @media (max-width:860px){ .layout{grid-template-columns:1fr} nav{display:none} }
  </style>
</head>
<body>
  <div class="pick">
    <strong>DEMO D · Steam Dark</strong>
    <div><a href="./">← Todas</a> · <a href="e-arcade-cabinet.html">Siguiente E →</a></div>
  </div>
  <header class="site"><div class="shell hi">
    <a class="logo" href="#"><span class="mark">AH</span><span class="name">ARCADEHUB</span></a>
    <nav><a href="#">Tienda</a><a href="#">Biblioteca</a><a href="#">Admin</a></nav>
    <label class="search"><input placeholder="Buscar en el catálogo…" /></label>
  </div></header>
  <div class="shell layout">
    <aside class="side">
      <h2>Categorías</h2>
      <button class="on">Todos</button>
      <button>Arcade</button>
      <button>Puzzle</button>
      <button>Acción</button>
      <button>Estrategia</button>
    </aside>
    <section>
      <div class="hero">
        <p class="eyebrow">Destacados</p>
        <h1>Tu biblioteca de juegos</h1>
        <p class="lede">Minijuegos incluidos y títulos externos de Render, al estilo tienda.</p>
        <div class="meta"><span><b>8</b> juegos</span><span><b>4</b> categorías</span><span><b>HTML5</b></span></div>
      </div>
      <h2 class="section-title">Todos los juegos</h2>
      <div class="grid" id="g"></div>
    </section>
  </div>
  <script>
    const games=[["Snake","#1a6b4a","🐍","Arcade"],["Tres en Raya","#2b4d7a","⭕","Estrategia"],["Memory","#7a2b5a","🧠","Puzzle"],["Pong","#1a5a5a","🏓","Arcade"],["Breakout","#8a4a20","🧱","Arcade"],["Flappy","#4a6a20","🐥","Arcade"],["Whack","#6a4a20","🔨","Acción"],["RPS","#4a2a7a","✊","Estrategia"]];
    document.getElementById("g").innerHTML=games.map(([t,c,e,cat])=>`<article class="card"><div class="thumb" style="background:linear-gradient(160deg,${c},#0b141d)">${e}</div><div class="info"><h3>${t}</h3><p>${cat}</p></div></article>`).join("");
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A · Neon Cyber — ArcadeHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05080f; --panel: #0b1220; --text: #e8f7ff; --muted: #7f9bb3;
      --cyan: #22d3ee; --mag: #e879f9; --line: rgba(34,211,238,.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Rajdhani, sans-serif; color: var(--text);
      background:
        radial-gradient(ellipse 60% 40% at 10% 0%, rgba(232,121,249,.18), transparent 50%),
        radial-gradient(ellipse 50% 35% at 90% 10%, rgba(34,211,238,.16), transparent 45%),
        var(--bg);
    }
    .pick { position: sticky; top: 0; z-index: 50; background: #061018ee; border-bottom: 1px solid var(--line); padding: .7rem 1rem; display: flex; gap: .75rem; align-items: center; justify-content: space-between; backdrop-filter: blur(8px); }
    .pick a { color: var(--cyan); font-weight: 700; text-decoration: none; }
    .pick strong { font-family: Orbitron, sans-serif; letter-spacing: .04em; }
    .shell { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; }
    header.site { border-bottom: 1px solid var(--line); background: rgba(5,8,15,.85); }
    .hi { display: flex; align-items: center; gap: 1rem; min-height: 68px; }
    .logo { display: flex; align-items: center; gap: .55rem; text-decoration: none; color: var(--text); }
    .mark { width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border: 1px solid var(--cyan); box-shadow: 0 0 16px rgba(34,211,238,.45); color: var(--cyan); font-family: Orbitron, sans-serif; font-size: .7rem; font-weight: 800; }
    .name { font-family: Orbitron, sans-serif; font-weight: 800; letter-spacing: .08em; text-shadow: 0 0 18px rgba(232,121,249,.45); }
    nav { display: flex; gap: 1rem; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 700; }
    nav a:hover { color: var(--cyan); }
    .search { margin-left: auto; }
    .search input { background: #0a1524; border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: .55rem 1rem; font: inherit; min-width: 220px; outline: none; }
    .search input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,.15); }
    .intro { padding: 2.2rem 0 1rem; display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.2rem; }
    .eyebrow { color: var(--mag); text-transform: uppercase; letter-spacing: .14em; font-weight: 700; margin: 0 0 .4rem; font-size: .8rem; }
    h1 { margin: 0; font-family: Orbitron, sans-serif; font-size: clamp(1.7rem, 4vw, 2.6rem); letter-spacing: .02em; text-shadow: 0 0 24px rgba(34,211,238,.35); }
    .lede { color: var(--muted); max-width: 40ch; }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: .7rem; }
    .stats div { background: var(--panel); border: 1px solid var(--line); padding: .9rem; box-shadow: inset 0 0 20px rgba(34,211,238,.05); }
    .stats strong { display: block; font-family: Orbitron, sans-serif; color: var(--cyan); font-size: 1.3rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .45rem; margin: 1rem 0; }
    .chip { border: 1px solid var(--line); background: transparent; color: var(--text); padding: .4rem .85rem; font: inherit; font-weight: 700; cursor: pointer; }
    .chip.on { background: linear-gradient(90deg, rgba(34,211,238,.2), rgba(232,121,249,.2)); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 14px rgba(34,211,238,.25); }
    h2 { font-family: Orbitron, sans-serif; font-size: 1rem; letter-spacing: .08em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(190px,1fr)); gap: 1rem; padding-bottom: 2.5rem; }
    .card { background: var(--panel); border: 1px solid var(--line); overflow: hidden; transition: .15s; }
    .card:hover { transform: translateY(-4px); border-color: var(--mag); box-shadow: 0 0 24px rgba(232,121,249,.2); }
    .thumb { aspect-ratio: 16/10; display: grid; place-items: center; font-size: 2.4rem; position: relative; }
    .badge { position: absolute; right: .6rem; bottom: .6rem; font-size: .72rem; font-weight: 800; letter-spacing: .06em; padding: .25rem .5rem; background: #000c; border: 1px solid var(--cyan); color: var(--cyan); }
    .info { padding: .8rem .9rem 1rem; }
    .info h3 { margin: 0; font-family: Orbitron, sans-serif; font-size: .95rem; }
    .info p { margin: .35rem 0 .55rem; color: var(--muted); font-size: .88rem; }
    .tag { color: var(--mag); font-size: .72rem; font-weight: 800; letter-spacing: .08em; }
    @media (max-width:800px){ .intro{grid-template-columns:1fr} nav{display:none} .search{width:100%;margin:0} .hi{flex-wrap:wrap} }
  </style>
</head>
<body>
  <div class="pick">
    <strong>DEMO A · Neon Cyber</strong>
    <div><a href="./">← Todas</a> · <a href="b-retro-pixel.html">Siguiente B →</a></div>
  </div>
  <header class="site"><div class="shell hi">
    <a class="logo" href="#"><span class="mark">AH</span><span class="name">ARCADEHUB</span></a>
    <nav><a href="#">Juegos</a><a href="#">Categorías</a><a href="#">Admin</a></nav>
    <label class="search"><input placeholder="Buscar juegos…" /></label>
  </div></header>
  <main class="shell">
    <section class="intro">
      <div>
        <p class="eyebrow">Online · Instant play</p>
        <h1>ENTRA AL GRID.</h1>
        <p class="lede">Portal gamer con minijuegos y títulos en la nube. Un clic y estás dentro.</p>
      </div>
      <div class="stats">
        <div><strong>8</strong><span>juegos</span></div>
        <div><strong>4</strong><span>cats</span></div>
        <div><strong>LIVE</strong><span>html5</span></div>
      </div>
    </section>
    <div class="chips">
      <button class="chip on">Todos</button><button class="chip">Arcade</button><button class="chip">Puzzle</button><button class="chip">Acción</button>
    </div>
    <h2>CATÁLOGO</h2>
    <div class="grid" id="g"></div>
  </main>
  <script>
    const games=[["Snake","#0e7490","🐍","Arcade"],["Tres en Raya","#6d28d9","⭕","Estrategia"],["Memory","#be185d","🧠","Puzzle"],["Pong","#0f766e","🏓","Arcade"],["Breakout","#c2410c","🧱","Arcade"],["Flappy","#4d7c0f","🐥","Arcade"],["Whack","#92400e","🔨","Acción"],["RPS","#5b21b6","✊","Estrategia"]];
    document.getElementById("g").innerHTML=games.map(([t,c,e,cat])=>`<article class="card"><div class="thumb" style="background:linear-gradient(145deg,${c},${c}99)"><span>${e}</span><span class="badge">PLAY</span></div><div class="info"><h3>${t}</h3><p>Minijuego listo para jugar.</p><span class="tag">${cat}</span></div></article>`).join("");
  </script>
</body>
</html>

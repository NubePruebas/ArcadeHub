<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C · Esports HUD — ArcadeHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0a0a0a; --panel:#121212; --text:#f5f5f5; --muted:#a3a3a3; --red:#ef4444; --line:#262626; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans", sans-serif; color: var(--text); background: var(--bg); }
    .pick { position: sticky; top: 0; z-index: 50; background: #000; border-bottom: 2px solid var(--red); padding: .7rem 1rem; display: flex; justify-content: space-between; align-items: center; }
    .pick strong { font-family: "Bebas Neue", sans-serif; font-size: 1.3rem; letter-spacing: .06em; }
    .pick a { color: var(--red); font-weight: 700; text-decoration: none; }
    .shell { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; }
    header.site { background: #000; border-bottom: 1px solid var(--line); }
    .hi { display: flex; align-items: center; gap: 1rem; min-height: 64px; }
    .logo { display: flex; align-items: center; gap: .55rem; text-decoration: none; color: #fff; }
    .mark { background: var(--red); color: #fff; font-family: "Bebas Neue", sans-serif; font-size: 1.1rem; padding: .25rem .45rem; clip-path: polygon(0 0, 100% 0, 100% 70%, 85% 100%, 0 100%); }
    .name { font-family: "Bebas Neue", sans-serif; font-size: 1.7rem; letter-spacing: .08em; }
    nav { display: flex; gap: 1rem; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: .8rem; letter-spacing: .06em; }
    nav a:hover { color: var(--red); }
    .search { margin-left: auto; }
    .search input { background: #171717; border: 1px solid var(--line); color: #fff; padding: .55rem .9rem; min-width: 220px; font: inherit; clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
    .banner { margin-top: 1.2rem; background: linear-gradient(90deg, #1a0505, #000 40%, #1a0505); border-left: 4px solid var(--red); padding: 1.4rem 1.2rem; display: grid; grid-template-columns: 1.5fr auto; gap: 1rem; align-items: center; }
    .eyebrow { margin: 0; color: var(--red); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: .72rem; }
    h1 { margin: .2rem 0; font-family: "Bebas Neue", sans-serif; font-size: clamp(2.4rem, 6vw, 4rem); letter-spacing: .04em; line-height: .95; }
    .lede { margin: 0; color: var(--muted); }
    .score { display: flex; gap: .6rem; }
    .score div { background: #171717; border: 1px solid var(--line); padding: .7rem .9rem; text-align: center; min-width: 78px; }
    .score strong { display: block; font-family: "Bebas Neue", sans-serif; font-size: 1.8rem; color: var(--red); line-height: 1; }
    .score span { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1.2rem 0 .8rem; }
    .chip { border: 1px solid var(--line); background: transparent; color: #fff; font: inherit; font-weight: 700; text-transform: uppercase; font-size: .78rem; letter-spacing: .05em; padding: .45rem .8rem; cursor: pointer; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
    .chip.on { background: var(--red); border-color: var(--red); }
    h2 { font-family: "Bebas Neue", sans-serif; font-size: 1.6rem; letter-spacing: .06em; margin: 0 0 .7rem; border-bottom: 2px solid var(--red); display: inline-block; padding-bottom: .15rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: .85rem; padding-bottom: 2.5rem; }
    .card { background: var(--panel); border: 1px solid var(--line); display: grid; grid-template-columns: 88px 1fr; overflow: hidden; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }
    .card:hover { border-color: var(--red); }
    .thumb { display: grid; place-items: center; font-size: 2rem; border-right: 1px solid var(--line); }
    .info { padding: .75rem .85rem; }
    .info h3 { margin: 0; font-family: "Bebas Neue", sans-serif; font-size: 1.35rem; letter-spacing: .04em; }
    .info p { margin: .15rem 0 .45rem; color: var(--muted); font-size: .82rem; }
    .play { display: inline-block; background: var(--red); color: #fff; font-size: .68rem; font-weight: 800; letter-spacing: .08em; padding: .25rem .5rem; text-transform: uppercase; }
    @media (max-width:800px){ .banner{grid-template-columns:1fr} nav{display:none} }
  </style>
</head>
<body>
  <div class="pick">
    <strong>DEMO C · ESPORTS HUD</strong>
    <div><a href="./">← Todas</a> · <a href="d-steam-dark.html">Siguiente D →</a></div>
  </div>
  <header class="site"><div class="shell hi">
    <a class="logo" href="#"><span class="mark">AH</span><span class="name">ARCADEHUB</span></a>
    <nav><a href="#">Juegos</a><a href="#">Ranking</a><a href="#">Admin</a></nav>
    <label class="search"><input placeholder="Buscar partida…" /></label>
  </div></header>
  <main class="shell">
    <section class="banner">
      <div>
        <p class="eyebrow">Match ready</p>
        <h1>ELIGE<br>TU JUEGO</h1>
        <p class="lede">Lobby competitivo. Entra, juega, repite.</p>
      </div>
      <div class="score">
        <div><strong>8</strong><span>Games</span></div>
        <div><strong>4</strong><span>Lanes</span></div>
        <div><strong>GO</strong><span>Live</span></div>
      </div>
    </section>
    <div class="chips">
      <button class="chip on">Todos</button><button class="chip">Arcade</button><button class="chip">Puzzle</button><button class="chip">Acción</button>
    </div>
    <h2>ROSTER</h2>
    <div class="grid" id="g"></div>
  </main>
  <script>
    const games=[["Snake","#450a0a","🐍","Arcade"],["Tres en Raya","#1c1917","⭕","Estrategia"],["Memory","#3f0a1a","🧠","Puzzle"],["Pong","#0c1a1a","🏓","Arcade"],["Breakout","#431407","🧱","Arcade"],["Flappy","#14210a","🐥","Arcade"],["Whack","#2a1608","🔨","Acción"],["RPS","#1e1033","✊","Estrategia"]];
    document.getElementById("g").innerHTML=games.map(([t,c,e,cat])=>`<article class="card"><div class="thumb" style="background:${c}">${e}</div><div class="info"><h3>${t}</h3><p>${cat}</p><span class="play">Play</span></div></article>`).join("");
  </script>
</body>
</html>
